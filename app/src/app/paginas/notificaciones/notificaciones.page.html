<ion-content [fullscreen]="true">
  <app-cabecera titulo="Notificaciones" [subtitulo]="notificaciones.length + ' sin leer'" atras="/app/inicio">
    @if (notificaciones.length > 0) {
      <div class="botones-cabecera">
        <button class="boton-cabecera" (click)="borrarTodas()">Marcar todas como leídas</button>
      </div>
    }
  </app-cabecera>

  <div class="contenido">
    @if (notificaciones.length > 0) {
      <ion-list [inset]="true">
        @for (n of notificaciones; track n.id) {
          <ion-item-sliding>
            <ion-item>
              <!-- El icono y su color dependen del tipo de aviso -->
              @switch (n.tipo) {
                @case (0) { <ion-icon slot="start" name="alarm-outline" color="danger"></ion-icon> }
                @case (1) { <ion-icon slot="start" name="restaurant-outline" color="primary"></ion-icon> }
                @case (2) { <ion-icon slot="start" name="cart-outline" color="secondary"></ion-icon> }
                @default { <ion-icon slot="start" name="wallet-outline" color="tertiary"></ion-icon> }
              }
              <ion-label class="ion-text-wrap">
                <p class="texto">{{ n.texto }}</p>
                <ion-note>{{ n.hace }}</ion-note>
              </ion-label>
            </ion-item>
            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="borrar(n)">Borrar</ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-list>
    } @else {
      <app-estado-vacio icono="notifications-off-outline" titulo="Todo al día">
        <p>No tienes avisos pendientes.</p>
      </app-estado-vacio>
    }
  </div>
</ion-content>
