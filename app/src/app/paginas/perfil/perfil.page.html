<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list [inset]="true">
    <ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-toggle (ionChange)="cambiarTema($event)">Modo oscuro</ion-toggle>
    </ion-item>
  </ion-list>

  <ion-button color="danger" fill="outline" expand="block" routerLink="/entrada" routerDirection="root">
    Cerrar sesión
  </ion-button>
</ion-content>
