<ion-tabs (ionTabsDidChange)="cambiarPestana($event)">
  <ion-tab-bar slot="bottom">
    @for (pestana of pestanas; track pestana.tab) {
      <ion-tab-button [tab]="pestana.tab">
        <ion-icon [name]="pestanaActiva === pestana.tab ? pestana.icono : pestana.icono + '-outline'"></ion-icon>
        <ion-label>{{ pestana.texto }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
