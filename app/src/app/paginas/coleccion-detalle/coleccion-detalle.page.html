<ion-content [fullscreen]="true">
  <app-cabecera [titulo]="coleccion() ? coleccion()!.nombre + ' ' + coleccion()!.icono : 'Colección'"
                [subtitulo]="recetas().length + ' recetas'" atras="/app/favoritos" />

  <div class="contenido">
    @if (coleccion()) {
      @for (receta of recetas(); track receta.id) {
        <app-tarjeta-receta [receta]="receta" seccion="favoritos" />
      } @empty {
        <app-estado-vacio icono="bookmark-outline" titulo="Colección vacía">
          <p>Guarda aquí recetas desde su ficha para tenerlas a mano.</p>
        </app-estado-vacio>
      }
    } @else {
      <app-estado-vacio icono="sad-outline" titulo="Esta colección no existe" />
    }
  </div>
</ion-content>
