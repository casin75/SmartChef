<ion-content [fullscreen]="true">
  <app-cabecera titulo="Inicio de sesión" atras="/entrada" />

  <form class="formulario">
    <label class="campo">
      <span>Nombre del usuario</span>
      <ion-input aria-label="Nombre del usuario" placeholder="eliasponcas" autocomplete="username"></ion-input>
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <ion-input aria-label="Contraseña" type="password" placeholder="••••••••" autocomplete="current-password">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </label>

    <a class="olvido">¿Olvidaste la contraseña?</a>
  </form>
</ion-content>

<ion-footer class="pie-formulario">
  <ion-button expand="block" routerLink="/app/inicio" routerDirection="root">Iniciar sesión</ion-button>
  <p>¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</ion-footer>
