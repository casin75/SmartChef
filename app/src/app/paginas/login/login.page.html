<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/entrada"></ion-back-button>
    </ion-buttons>
    <ion-title>Inicio de sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-input label="Nombre del usuario" labelPlacement="stacked" placeholder="eliasponcas"></ion-input>
  <ion-input label="Contraseña" labelPlacement="stacked" type="password"></ion-input>
  <ion-button expand="block" routerLink="/app/inicio" routerDirection="root">Iniciar sesión</ion-button>
</ion-content>
