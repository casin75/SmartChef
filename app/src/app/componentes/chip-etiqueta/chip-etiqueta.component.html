@switch (etiqueta()) {
  @case ('VEGETARIANA') { <span class="chip verde">Vegetariano</span> }
  @case ('RAPIDA') { <span class="chip naranja">Rápido</span> }
  @case ('TEMPORADA') { <span class="chip hoja">Temporada ✓</span> }
  @case ('PROTEINAS') { <span class="chip azul">Alto en proteínas</span> }
  @case ('SIN_GLUTEN') { <span class="chip crema">Sin gluten</span> }
}
