spring.application.name=SmartChefJava

# --- Conexion a la base de datos -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${SCHEMA}
# --- JPA / Hibernate -----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Depuración -----------------------------------------------
# Comprueba la persistencia al arrancar (PersistenciaRunner) y muestra en el log
# los valores que se envían en cada consulta SQL
app.verificar-persistencia=true
logging.level.org.hibernate.orm.jdbc.bind=trace
# --- Servidor ------------------------------------------------
server.port=8080

# --- API -----------------------------------------------------
# Las fotos de una página de recetas se cargan en una sola consulta en vez de una por receta
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Nadie puede pedir páginas gigantes
spring.data.web.pageable.max-page-size=50
# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
